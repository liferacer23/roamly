name: roamly
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: roamly_local
      POSTGRES_DB: roamly
    ports:
      - '127.0.0.1:54326:5432'
    volumes:
      - roamly-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roamly -d roamly']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  roamly-data:
